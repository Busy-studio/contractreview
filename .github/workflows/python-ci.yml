name: Python CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  syntax-and-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Python
        run: python -m py_compile app.py contract_core.py law_api.py openai_models.py legal_validator.py
      - name: Import core modules
        run: |
          python - <<'PY'
          import law_api
          import openai_models
          import legal_validator
          import contract_core
          print("core imports: OK")
          PY
